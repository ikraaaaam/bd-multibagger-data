name: BD Multibagger AI - Orchestrator

on:
  schedule:
    - cron: '0 14 28 * *' # 28th of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ai-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Orchestrator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ai_orchestrator.py

      - name: Commit and push allocation
        run: |
          git config user.name "bd-multibagger-bot"
          git config user.email "actions@github.com"
          git add data/latest_picks.md data/latest_picks.json data/budget.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "docs(ai): monthly allocation and telegram notification"
          git push
